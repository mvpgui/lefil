<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Le Fil — bientôt de retour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Fraunces:opsz,wght@9..144,700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e100f;--ink:#ece8dc;--muted:#8a897f;--amber:#ffb000}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',Georgia,serif;text-align:center;padding:24px;box-sizing:border-box}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:44px;margin:0 0 14px}
  h1 span{color:var(--amber)}
  p{color:var(--muted);font-size:17px;line-height:1.6;margin:0;max-width:420px}
  small{display:block;margin-top:28px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
  <main>
    <h1>Le Fil<span>.</span></h1>
    <p>La revue de presse de vos valeurs revient bientôt, avec un compte personnel pour chacun.</p>
    <small>En préparation</small>
  </main>
</body>
</html>
